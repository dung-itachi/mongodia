<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {

/* =========================================================
   LOGIN FORM STYLES
========================================================= */

.scene {
    width: 390px;
    height: auto;
    min-height: 550px;
    position: fixed;
    top: 50%;
    right: 5%;
    transform: translateY(-50%);
    perspective: 1400px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.login-card {
    width: 100%;
    padding: 42px;
    position: relative;
    border-radius: 30px;
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.92));
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    transform-style: preserve-3d;
    cursor: grab;
    will-change: transform;
    box-shadow: 0 60px 100px rgba(0, 0, 0, 0.5), 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transition: transform 0.15s ease-out, box-shadow 0.4s ease;
}

.login-card::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 29px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 35%);
    pointer-events: none;
}

.light {
    position: absolute;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(129, 140, 248, 0.25), transparent 70%);
    filter: blur(20px);
    will-change: transform, opacity;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: left 0.1s, top 0.1s;
}

.login-content {
    position: relative;
    transform-style: preserve-3d;
}

.login-content .logo {
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 25px;
    box-shadow: 0 20px 35px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    transform: translateZ(60px);
    transition: transform 0.3s ease;
}

.login-content .logo:hover {
    transform: translateZ(75px) rotateY(10deg) rotateX(-8deg);
}

.login-content h1 {
    color: white;
    font-size: 31px;
    letter-spacing: -1px;
    margin-bottom: 8px;
    transform: translateZ(45px);
}

.login-content .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 30px;
    transform: translateZ(35px);
}

.login-content .form-group {
    margin-bottom: 18px;
    transform-style: preserve-3d;
}

.login-content .form-group label {
    display: block;
    color: #cbd5e1;
    font-size: 13px;

    margin-bottom: 8px;

}

.login-content .form-group input {

    padding: 0 16px;

    border: 1px solid rgba(255, 255, 255, 0.1);
    outline: none;

    color: white;

}

.login-content .form-group input:focus {

.login-content .form-group input::placeholder {

.login-content .options {

.login-content .remember input {

}

.login-content .forgot {

}

.login-content .login-btn {

    border: none;
    border-radius: 13px;

}

.login-content .login-btn::before {

    top: -50%;

}

.login-content .login-btn:hover::before {

}

.login-content .login-btn:hover {

}

.login-content .login-btn:active {

}

.login-content .divider {

}

.login-content .divider::before,
.login-content .divider::after {

.login-content .social {

.login-content .social-btn {

.login-content .register a {

#app {

.content .label {

/* =========================================================

@media(max-width: 900px) {

<!-- Login Form -->
<div class="scene">
    <div class="login-card" id="card">
        <div class="light" id="light"></div>
        <div class="login-content">

<script type="module">

/* =========================================================
   IMPORT
========================================================= */

import * as THREE
    from "three";


import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";


/* =========================================================
   APP
========================================================= */

const app =
    document.getElementById(
        "app"
    );


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        38,

        window.innerWidth /
        window.innerHeight,

        0.01,

        2000
    );


camera.position.set(

    -0.15,

    0.05,

    3.25
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true,

        powerPreference:
            "high-performance"
    });


renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,

        2.5
    )
);


renderer.setSize(

    window.innerWidth,

    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.15;


app.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
    new OrbitControls(

        camera,

        renderer.domElement
    );


controls.enableDamping =
    true;


controls.dampingFactor =
    0.025;


controls.enablePan =
    false;


controls.enableZoom =
    true;


controls.minDistance =
    1.45;


controls.maxDistance =
    7;


controls.zoomSpeed =
    0.7;


controls.rotateSpeed =
    0.45;


controls.autoRotate =
    true;


controls.autoRotateSpeed =
    0.08;


/* =========================================================
   LIGHT
========================================================= */

const ambient =
    new THREE.AmbientLight(

        0x17304c,

        0.12
    );


scene.add(
    ambient
);


/* =========================================================
   SUN
========================================================= */

const sun =
    new THREE.DirectionalLight(

        0xffffff,

        4.2
    );


sun.position.set(

    5,

    2,

    4
);


scene.add(
    sun
);


/* =========================================================
   EARTH GROUP
========================================================= */

const earthGroup =
    new THREE.Group();


earthGroup.position.set(

    0.55,

    0,

    0
);


earthGroup.rotation.z =
    THREE.MathUtils.degToRad(
        -23.5
    );


scene.add(
    earthGroup
);


/* =========================================================
   LOADER
========================================================= */

const loader =
    new THREE.TextureLoader();


/* =========================================================
   TEXTURE URLS
========================================================= */

const TEXTURES = {

    earth:
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",

    normal:
        "https://threejs.org/examples/textures/planets/earth_normal_2048.jpg",

    specular:
        "https://threejs.org/examples/textures/planets/earth_specular_2048.jpg",

    clouds:
        "https://threejs.org/examples/textures/planets/earth_clouds_1024.png",

    lights:
        "https://threejs.org/examples/textures/planets/earth_lights_2048.png"

};


/* =========================================================
   TEXTURE ANISOTROPY
========================================================= */

const maxAnisotropy =
    renderer.capabilities
        .getMaxAnisotropy();


/* =========================================================
   LOAD TEXTURE
========================================================= */

function loadTexture(
    url
) {

    const texture =
        loader.load(url);


    texture.anisotropy =
        maxAnisotropy;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.ClampToEdgeWrapping;


    return texture;
}


/* =========================================================
   LOAD ALL
========================================================= */

const earthMap =
    loadTexture(
        TEXTURES.earth
    );


const normalMap =
    loadTexture(
        TEXTURES.normal
    );


const specularMap =
    loadTexture(
        TEXTURES.specular
    );


const cloudMap =
    loadTexture(
        TEXTURES.clouds
    );


const lightsMap =
    loadTexture(
        TEXTURES.lights
    );


earthMap.colorSpace =
    THREE.SRGBColorSpace;


cloudMap.colorSpace =
    THREE.SRGBColorSpace;


lightsMap.colorSpace =
    THREE.SRGBColorSpace;


/* =========================================================
   EARTH GEOMETRY
========================================================= */

const earthGeometry =
    new THREE.SphereGeometry(

        1,

        256,

        256
    );


/* =========================================================
   EARTH MATERIAL
========================================================= */

const earthMaterial =
    new THREE.MeshPhongMaterial({

        map:
            earthMap,

        normalMap:
            normalMap,

        normalScale:
            new THREE.Vector2(
                1.25,
                1.25
            ),

        specularMap:
            specularMap,

        specular:
            new THREE.Color(
                0x394d62
            ),

        shininess:
            20
    });


/* =========================================================
   EARTH
========================================================= */

const earth =
    new THREE.Mesh(

        earthGeometry,

        earthMaterial
    );


earthGroup.add(
    earth
);


/* =========================================================
   CLOUDS
========================================================= */

const cloudGeometry =
    new THREE.SphereGeometry(

        1.012,

        256,

        256
    );


const cloudMaterial =
    new THREE.MeshPhongMaterial({

        map:
            cloudMap,

        transparent:
            true,

        opacity:
            0.82,

        depthWrite:
            false,

        side:
            THREE.FrontSide
    });


const clouds =
    new THREE.Mesh(

        cloudGeometry,

        cloudMaterial
    );


earthGroup.add(
    clouds
);


/* =========================================================
   CITY LIGHTS
========================================================= */

const cityGeometry =
    new THREE.SphereGeometry(

        1.004,

        256,

        256
    );


/*
    City lights sẽ được làm dịu.
*/

const cityMaterial =
    new THREE.MeshBasicMaterial({

        map:
            lightsMap,

        transparent:
            true,

        opacity:
            0.8,

        blending:
            THREE.AdditiveBlending,

        depthWrite:
            false
    });


const cityLights =
    new THREE.Mesh(

        cityGeometry,

        cityMaterial
    );


earthGroup.add(
    cityLights
);


/* =========================================================
   ATMOSPHERE SHADER
========================================================= */

const atmosphereGeometry =
    new THREE.SphereGeometry(

        1.07,

        192,

        192
    );


const atmosphereMaterial =
    new THREE.ShaderMaterial({

        transparent:
            true,

        side:
            THREE.BackSide,

        blending:
            THREE.AdditiveBlending,

        uniforms: {

            glowColor: {

                value:
                    new THREE.Color(
                        0x258dff
                    )
            }

        },


        vertexShader: `

            varying vec3 vNormal;

            void main() {

                vNormal =
                    normalize(
                        normalMatrix *
                        normal
                    );

                gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(
                        position,
                        1.0
                    );
            }

        `,


        fragmentShader: `

            uniform vec3 glowColor;

            varying vec3 vNormal;

            void main() {

                float intensity =
                    pow(

                        0.72 -

                        dot(

                            vNormal,

                            vec3(
                                0.0,
                                0.0,
                                1.0
                            )

                        ),

                        3.5
                    );


                gl_FragColor =
                    vec4(

                        glowColor,

                        intensity *
                        0.9
                    );

            }

        `
    });


const atmosphere =
    new THREE.Mesh(

        atmosphereGeometry,

        atmosphereMaterial
    );


earthGroup.add(
    atmosphere
);


/* =========================================================
   OUTER ATMOSPHERE
========================================================= */

const outerAtmosphere =
    new THREE.Mesh(

        new THREE.SphereGeometry(

            1.12,

            128,

            128
        ),

        new THREE.MeshBasicMaterial({

            color:
                0x168cff,

            transparent:
                true,

            opacity:
                0.045,

            side:
                THREE.BackSide,

            blending:
                THREE.AdditiveBlending
        })
    );


earthGroup.add(
    outerAtmosphere
);


/* =========================================================
   STAR FIELD
========================================================= */

const STAR_COUNT =
    16000;


const starGeometry =
    new THREE.BufferGeometry();


const starPositions =
    new Float32Array(

        STAR_COUNT * 3
    );


for (
    let i = 0;
    i < STAR_COUNT;
    i++
) {

    const radius =
        30 +
        Math.random() * 130;


    const theta =
        Math.random() *
        Math.PI *
        2;


    const phi =
        Math.acos(

            2 *
            Math.random() -
            1
        );


    starPositions[
        i * 3
    ] =

        radius *
        Math.sin(phi) *
        Math.cos(theta);


    starPositions[
        i * 3 + 1
    ] =

        radius *
        Math.cos(phi);


    starPositions[
        i * 3 + 2
    ] =

        radius *
        Math.sin(phi) *
        Math.sin(theta);
}


starGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(

        starPositions,

        3
    )
);


const starMaterial =
    new THREE.PointsMaterial({

        color:
            0xffffff,

        size:
            0.025,

        sizeAttenuation:
            true,

        transparent:
            true,

        opacity:
            0.85
    });


const stars =
    new THREE.Points(

        starGeometry,

        starMaterial
    );


scene.add(
    stars
);


/* =========================================================
   SECOND STAR FIELD
========================================================= */

const star2 =
    new THREE.Points(

        starGeometry.clone(),

        new THREE.PointsMaterial({

            color:
                0x79a9ff,

            size:
                0.012,

            transparent:
                true,

            opacity:
                0.45
        })
    );


scene.add(
    star2
);


/* =========================================================
   MOUSE PARALLAX
========================================================= */

let mouseX = 0;

let mouseY = 0;


window.addEventListener(

    "mousemove",

    event => {

        mouseX =

            (
                event.clientX /
                window.innerWidth
            ) * 2 - 1;


        mouseY =

            (
                event.clientY /
                window.innerHeight
            ) * 2 - 1;

    }
);


/* =========================================================
   CLOCK
========================================================= */

const clock =
    new THREE.Clock();


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /* --------------------------------
       EARTH ROTATION
    -------------------------------- */

    earth.rotation.y +=
        0.00065;


    /* --------------------------------
       CLOUD ROTATION
    -------------------------------- */

    clouds.rotation.y +=
        0.001;


    /* --------------------------------
       CITY LIGHTS
    -------------------------------- */

    cityLights.rotation.y =
        earth.rotation.y;


    /* --------------------------------
       STAR MOVEMENT
    -------------------------------- */

    stars.rotation.y +=
        0.000008;


    star2.rotation.y -=
        0.000005;


    /* --------------------------------
       MOUSE PARALLAX
    -------------------------------- */

    earthGroup.rotation.x +=

        (
            -mouseY * 0.025 -
            earthGroup.rotation.x
        ) * 0.002;


    /* --------------------------------
       CONTROLS
    -------------------------------- */

    controls.update();


    /* --------------------------------
       RENDER
    -------------------------------- */

    renderer.render(

        scene,

        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(

    "resize",

    () => {

        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight
        );

    }
);


/* =========================================================
   HIDE LOADING
========================================================= */

setTimeout(

    () => {

        document
            .getElementById(
                "loading"
            )
            .classList.add(
                "hide"
            );

    },

    2500
);

/* =========================================================
   CARD INTERACTION - Hover tilt + Drag rotate
========================================================= */

const card = document.getElementById("card");
const light = document.getElementById("light");
const formScene = document.querySelector(".scene");

let isDragging = false;
let cardRotationY = 0;
let cardRotationX = 0;
let lastMouseX = 0;
let lastMouseY = 0;

function isInsideFormArea(x, y) {
    if (!formScene) return false;
    const rect = formScene.getBoundingClientRect();
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
}

// Mouse down - start drag
card && card.addEventListener("mousedown", (e) => {
    if (!isInsideFormArea(e.clientX, e.clientY)) return;
    if (e.target.closest("input, button, a")) return;

    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    card.style.cursor = "grabbing";
});

// Mouse move
document.addEventListener("mousemove", (e) => {
    const insideForm = isInsideFormArea(e.clientX, e.clientY);

    // Update light position
    if (insideForm) {
        const rect = formScene.getBoundingClientRect();
        light.style.left = `${e.clientX - rect.left}px`;
        light.style.top = `${e.clientY - rect.top}px`;
    }

    if (isDragging && insideForm) {
        const deltaX = e.clientX - lastMouseX;
        const deltaY = e.clientY - lastMouseY;

        cardRotationY += deltaX * 0.5;
        cardRotationX -= deltaY * 0.5;
        cardRotationX = Math.max(-90, Math.min(90, cardRotationX));

        card.style.transform = `
            rotateX(${cardRotationX}deg)
            rotateY(${cardRotationY}deg)
            translateZ(30px)
        `;
        card.style.transition = "none";

        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    } else if (insideForm && !isDragging) {
        // Hover tilt effect
        const rect = formScene.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const tiltY = ((x - centerX) / centerX) * 12;
        const tiltX = ((centerY - y) / centerY) * 12;

        card.style.transform = `
            rotateX(${tiltX}deg)
            rotateY(${tiltY}deg)
        `;
        card.style.transition = "none";
    } else if (!insideForm && !isDragging) {
        // Return to default when outside
        card.style.transform = "rotateX(0deg) rotateY(0deg)";
        card.style.transition = "transform 0.4s ease";
    }
});

// Mouse up - return to default
document.addEventListener("mouseup", () => {
    if (isDragging) {
        isDragging = false;
        card.style.cursor = "grab";
        card.style.transition = "transform 0.6s ease, box-shadow 0.4s ease";
        card.style.transform = "rotateX(0deg) rotateY(0deg) translateZ(0)";
    }
});

// Form submit handler
document.querySelector(".login-card form")?.addEventListener("submit", (e) => {
    e.preventDefault();
    alert("Login demo");
});

</script>

</body>
</html>
